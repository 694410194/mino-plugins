# dsh-team-conductor bundle patch：挂载到官方 Agent Teams 引擎之上的控制面。
#
# 本插件自带 team_* 工具面 + 旧名别名（spawn_teammate/send_message 等），
# 与官方 tool-agent-team 的工具面是互斥替代关系——同名工具同 scope 会
# 当场拒建会话（实测撞线），故挂载本插件时禁用官方工具面；引擎
# （agent-team）与 UI（ui-agent-team）不受影响。
- id: tool-agent-team
  disabled: true

- insert:
    - id: team-conductor
      name: 'dsh-team-conductor'
