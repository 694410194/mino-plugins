# mino-mcp-memory：官方 memory 知识图谱 MCP 服务器接入（stdio，npx 拉起）。
# 纯配置 bundle——只插入一条官方 dsh-mcp-client 行，零代码；卸载本包即移除该服务器。
# 需要本机 node/npm（npx 首次运行会下载服务器包）。
- insert:
    - id: mcp-memory-pack
      name: 'mino-mcp-memory'
    - id: mcp-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memory
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-memory@2.0.1']
        env:
          # 固定记忆文件位置：默认落在 npx 缓存目录里，清缓存会静默丢记忆
          MEMORY_FILE_PATH: !!js (process.env.DSH_HOME || ((process.env.USERPROFILE || process.env.HOME) + '/.dsh')) + '/memory.jsonl'
