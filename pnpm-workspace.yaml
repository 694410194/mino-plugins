packages:
  - "packages/*"
  # Prebuilt community forks shipped only as release tarballs (packed one by
  # one); they take no part in the desktop build's frozen workspace install.
  - "!packages/aurabot"
  - "!packages/balance"
  - "!packages/bili-humanism"
  - "!packages/bili-scroll"
  - "!packages/bridge"
  - "!packages/browser"
  - "!packages/fish-memory"
  - "!packages/market"
  - "!packages/meme"
  - "!packages/mood"
  - "!packages/oh-story"
  - "!packages/open-sea"
  - "!packages/pilot"
  - "!packages/qq-link"
  - "!packages/speak-up"
  - "!packages/status"
  - "!packages/tavern"
  - "!packages/whale-musume"
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false
ignoredBuiltDependencies:
  - '@deepseek-ai/dsh-subprocess-local'
  - '@google/genai'
  - koffi
  - node-pty
  - protobufjs
