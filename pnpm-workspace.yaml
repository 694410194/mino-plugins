packages:
  - "packages/*"
  # Prebuilt community forks shipped only as release tarballs (packed one by
  # one); they take no part in the desktop build's frozen workspace install.
  - "!packages/aurabot"
  - "!packages/balance"
  - "!packages/bili-humanism"
  - "!packages/bili-scroll"
  - "!packages/bridge"
  - "!packages/browser"
  - "!packages/fish-memory"
  - "!packages/market"
  - "!packages/meme"
  - "!packages/mood"
  - "!packages/oh-story"
  - "!packages/open-sea"
  - "!packages/pilot"
  - "!packages/qq-link"
  - "!packages/speak-up"
  - "!packages/status"
  - "!packages/tavern"
  - "!packages/whale-musume"
  # 自建客户端打包 UI 插件：自带 node_modules 独立构建，同走 release tarball 通道
  - "!packages/feiyu-garden"
  - "!packages/chat-import"
  - "!packages/better-sidebar"
  - "!packages/damage-pulse"
  - "!packages/drawio"
  - "!packages/knowledge-studio"
  - "!packages/notes"
  - "!packages/ops"
  - "!packages/rewind"
  - "!packages/safety-net"
  - "!packages/skin-market"
  - "!packages/skill-explorer"
  - "!packages/skillhub"
  - "!packages/task-board"
  - "!packages/visualize"
  # Pure-config MCP bundles and skill packs: release-tarball-only, zero deps,
  # kept out of the frozen workspace install like the community forks.
  - "!packages/mcp-memory"
  - "!packages/mcp-thinking"
  - "!packages/mcp-chrome-devtools"
  - "!packages/mcp-github"
  - "!packages/mcp-brave-search"
  - "!packages/skill-drama"
  - "!packages/skill-screenwriting"
  - "!packages/skill-duanju"
  - "!packages/skill-script-review"
  - "!packages/skill-commit"
  - "!packages/skill-mino-release"
  - "!packages/skill-academic"
  - "!packages/skill-nature"
  - "!packages/skill-cnki"
  - "!packages/skill-paperjury"
  - "!packages/skill-humanizer"
  - "!packages/mcp-paper-search"
  # Connector packs: vendored third-party binaries + thin wrappers, release-tarball-only.
  - "!packages/connector-bills"
  - "!packages/browser-history"
  # Grok Bot parity vendored forks (prebuilt lib shipped) + pure-config mounts.
  - "!packages/agent-team"
  - "!packages/voice-input"
  - "!packages/distill"
  - "!packages/team-conductor"
  - "!packages/voice-mode"
  - "!packages/bot"
  - "!packages/proactive"
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false
ignoredBuiltDependencies:
  - '@deepseek-ai/dsh-subprocess-local'
  - '@google/genai'
  - koffi
  - node-pty
  - protobufjs
